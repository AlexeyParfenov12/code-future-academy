"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Результат на обучающей выборке показывает, насколько хорошо модель справляется со знакомыми примерами.</span></p></div></foreignObject><rect x="66.0" y="287.5000524934383" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="287.500" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="284.5000524934383" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="284.500" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Высокий результат на обучении и высокий результат на тесте означают, что модель хорошо справилась и со знакомыми, и с новыми примерами из имеющихся данных.</span></p></div></foreignObject><rect x="66.0" y="428.2499737532808" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="428.250" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="425.2499737532808" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="425.250" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Высокий результат на обучении и заметно более низкий результат на тесте могут указывать на переобучение.</span></p></div></foreignObject><rect x="66.0" y="532.7500262467191" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="532.750" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">04</span></p></div></foreignObject><rect x="154.0" y="529.7500262467191" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="529.750" width="1050.000" heigh