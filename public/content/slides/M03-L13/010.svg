erflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="409.0" width="1050.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="409.000" width="1050.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:33.000px;font-weight:400;font-style:normal;color:#172C43">Например, если среди трёх ближайших соседей два объекта относятся к классу 5, а один — к классу 3, модель выберет класс 5.</span></p></div></foreignObject><rect x="66.0" y="567.7500262467191" width="70.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="567.750" width="70.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">04</span></p></div></foreignObject><rect x="154.0" y="564.7500262467191" width="1050.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="564.750" width="1050.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:33.000px;font-weight:400;font-style:normal;color:#172C43">Чтобы определить неизвестный музыкальный жанр, можно найти три наиболее похожие песни в своей коллекции и посмотреть, к какому жанру относится большинство из них.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">10 / 28</span></p></div></foreignObject></svg>