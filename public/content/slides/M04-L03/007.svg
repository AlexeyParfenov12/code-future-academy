ord"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Сфера / специальность: Клиентский сервис, маркетинг, управление качеством, HR (анализ обратной связи от сотрудников)</span></p></div></foreignObject><rect x="66.0" y="287.5000524934383" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="287.500" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="284.5000524934383" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="284.500" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Проблема: Организация получает сотни обращений, отзывов или обратной связи в месяц из разных каналов.</span></p></div></foreignObject><rect x="66.0" y="392.0" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="392.000" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="389.0" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="389.000" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Конкретный пользователь: Руководитель отдела качества или клиентского сервиса, которому нужны еженедельные инсайты: что беспокоит клиентов/сотрудников, какие темы растут, где критические точки</span></p></div></foreignObject><rect x="66.0" y="532.7500262467191" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="532.750" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">04</span></p></div></foreignObject><rect x="154.0" y="529.7500262467191" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="529.750" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Входные данные: Неструктурированный текст: отзывы, письма, чаты, записи звонков (транскрипт); 50—2000 объектов/месяц; разные каналы и тональности</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">7 / 15</span></p></div></foreignObject></svg>