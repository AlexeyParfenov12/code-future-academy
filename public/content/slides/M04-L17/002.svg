n style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Промежуточная аттестация по модулю Технологии искусственного интеллекта.</span></p></div></foreignObject><rect x="66.0" y="287.5000524934383" width="70.0" height="163.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="287.500" width="70.000" height="163.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="284.5000524934383" width="1050.0" height="163.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="284.500" width="1050.000" height="163.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Аттестация проверяет не только знание основных понятий, но и умение применять их в профессиональной ситуации: анализировать условия, выбирать подходящее ИИ-решение, учитывать требования к данным и обосновывать результат.</span></p></div></foreignObject><rect x="66.0" y="464.5000524934383" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="464.500" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="461.5000524934383" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="461.500" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Максимальный результат за тестовую часть составляет 15 баллов, а за открытые и практико-ориентированные задания — 8 баллов.</span></p></div></foreignObject><rect x="66.0" y="569.0" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="569.000" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">04</span></p></div></foreignObject><rect x="154.0" y="566.0" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="566.000" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Обратите внимание: краткий ответ без обоснования может не показать, что решение соответствует профессиональной ситуации.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">2 / 6</span></p></div></foreignObject></svg>