<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 10"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">3.7. Ввод списка с клавиатуры</span></p></div></foreignObject><rect x="64.0" y="174.0" width="1152.0" height="390.0" fill="#172C43" stroke="none" stroke-width="0.0"/><rect x="88.0" y="194.0" width="1104.0" height="350.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="88.000" y="194.000" width="1104.000" height="350.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># Способ 1 – сначала количество, затем каждое число в отдельной строке</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">n = int(input())</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">nums = []</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">for i in range(n):</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    nums.append(int(input()))</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">print(nums)</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"></span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># Способ 2 – все числа в одной строке через пробел, например: 5 3 8</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">line = input()</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">nums = []</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">for part in line.split():</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    nums.append(int(part))</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">print(nums)</span></p></div></foreignObject><rect x="66.0" y="582.0" width="1150.0" height="65.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="582.000" width="1150.000" height="65.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#556A7D">Чаще всего данные не записаны в программе заранее, а вводятся пользователем.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">10 / 16</span></p></div></foreignObject></svg>