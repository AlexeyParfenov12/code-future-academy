<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 23"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">Работа с датасетом в pandas</span></p></div></foreignObject><rect x="64.0" y="174.0" width="1152.0" height="390.0" fill="#172C43" stroke="none" stroke-width="0.0"/><rect x="88.0" y="194.0" width="1104.0" height="350.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="88.000" y="194.000" width="1104.000" height="350.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">import pandas as pd</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># Загрузка данных</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">df = pd.DataFrame({</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    &#x27;площадь&#x27;:  [52, 35, 80, 65],</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    &#x27;этаж&#x27;:     [ 5,  2,  9,  7],</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    &#x27;метро_м&#x27;:  [800, 200, 1500, 600],</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    &#x27;ремонт&#x27;:   [  1,   0,    1,   1],</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    &#x27;цена&#x27;:     [6850000, 4200000, 9100000, 7500000]</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">})</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># Разделение на X (матрица признаков) и y (целевая переменная)</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">X = df.drop(columns=[&#x27;цена&#x27;])   # все столбцы КРОМЕ целевого</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">y = df[&#x27;цена&#x27;]                  # только целевой столбец</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">print(f&#x27;X: {X.shape}&#x27;)  # → X: (4, 4)  – 4 объекта, 4 признака</span></p></div></foreignObject><rect x="66.0" y="582.0" width="1150.0" height="35.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="582.000" width="1150.000" height="35.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:21.000px;font-weight:400;font-style:normal;color:#556A7D">Фрагмент примера. Полный код приведён в тексте лекции.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">23 / 27</span></p></div></foreignObject></svg>