<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 24"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">One-Hot Encoding в pandas</span></p></div></foreignObject><rect x="64.0" y="174.0" width="1152.0" height="390.0" fill="#172C43" stroke="none" stroke-width="0.0"/><rect x="88.0" y="194.0" width="1104.0" height="350.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="88.000" y="194.000" width="1104.000" height="350.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># Если есть категориальный признак</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">df_with_district = df.copy()</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">df_with_district[&#x27;район&#x27;] = [&#x27;Центральный&#x27;, &#x27;Южный&#x27;, &#x27;Северный&#x27;, &#x27;Центральный&#x27;]</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># One-Hot Encoding</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">df_encoded = pd.get_dummies(df_with_district, columns=[&#x27;район&#x27;])</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">print(df_encoded.columns.tolist())</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"># → [&#x27;площадь&#x27;, &#x27;этаж&#x27;, &#x27;метро_м&#x27;, &#x27;ремонт&#x27;, &#x27;цена&#x27;,</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">#     &#x27;район_Северный&#x27;, &#x27;район_Центральный&#x27;, &#x27;район_Южный&#x27;]</span></p></div></foreignObject><rect x="66.0" y="582.0" width="1150.0" height="65.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="582.000" width="1150.000" height="65.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#556A7D">pd.get_dummies делает то же, что таблица One-Hot Encoding выше: вместо одного столбца «район» появляются три бинарных столбца, по одному на каждое значение.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">24 / 27</span></p></div></foreignObject></svg>