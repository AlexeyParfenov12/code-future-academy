<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 21"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">Шаг 4. Проверить результат</span></p></div></foreignObject><rect x="64.0" y="174.0" width="1152.0" height="390.0" fill="#172C43" stroke="none" stroke-width="0.0"/><rect x="88.0" y="194.0" width="1104.0" height="350.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="88.000" y="194.000" width="1104.000" height="350.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">predictions = [&quot;кошка&quot;, &quot;собака&quot;, &quot;кошка&quot;, &quot;собака&quot;]</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">correct_answers = [&quot;кошка&quot;, &quot;кошка&quot;, &quot;кошка&quot;, &quot;собака&quot;]</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"></span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">correct = 0</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"></span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">for prediction, answer in zip(predictions, correct_answers):</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">    if prediction == answer:</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">        correct += 1</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB"></span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">accuracy = correct / len(correct_answers)</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">print(accuracy)</span></p></div></foreignObject><rect x="66.0" y="582.0" width="1150.0" height="65.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="582.000" width="1150.000" height="65.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#556A7D">После обучения модель проверяют на новых данных.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">21 / 31</span></p></div></foreignObject></svg>