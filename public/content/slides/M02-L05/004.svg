<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 4"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">Памятка команд</span></p></div></foreignObject><rect x="64.0" y="174.0" width="1152.0" height="390.0" fill="#172C43" stroke="none" stroke-width="0.0"/><rect x="88.0" y="194.0" width="1104.0" height="350.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="88.000" y="194.000" width="1104.000" height="350.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">abs(a - b) # размер разницы</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">errors.append(error) # добавить ошибку в список</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">min(errors) # самая маленькая ошибка</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">max(errors) # самая большая ошибка</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">sum(errors) / len(errors) # средняя ошибка</span></p><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Consolas,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#EDF9FB">round(value, 2) # округлить число</span></p></div></foreignObject><rect x="66.0" y="582.0" width="1150.0" height="65.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="582.000" width="1150.000" height="65.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:24.000px;font-weight:400;font-style:normal;color:#556A7D">Эти команды соответствуют основным этапам работы: вычислению одного промаха, накоплению результатов и получению обобщающих показателей.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width