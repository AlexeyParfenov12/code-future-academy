d"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Учебный сервисный центр обслуживает насосы, конвейеры и вентиляторы.</span></p></div></foreignObject><rect x="66.0" y="269.0" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="269.000" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="266.0" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="266.000" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family: Arial, sans-serif; font-size: 26.934px; font-weight: 400; font-style: normal; color: rgb(23, 44, 67);">Можно ли по параметрам оборудования, доступным в конце смены, определить, требуется ли срочное обслуживание в течение следующих 24 часов?</span></p></div></foreignObject><rect x="66.0" y="373.5000524934383" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="373.500" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="370.5000524934383" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="370.500" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Положительный класс соответствует случаю, когда срочное обслуживание потребуется, отрицательный — когда оно не потребуется.</span></p></div></foreignObject><rect x="66.0" y="478.0" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="478.000" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">04</span></p></div></foreignObject><rect x="154.0" y="475.0" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="475.000" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Даже если учебный прототип покажет хороший результат, его нельзя автоматически переносить на реальный сервисный центр.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">6 / 27</span></p></div></foreignObject></svg>