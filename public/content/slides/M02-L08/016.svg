<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 16"><rect width="1280.0" height="720.0" fill="#FFFFFF"></rect><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">Итоговый вывод</span></p></div></foreignObject><rect x="66.0" y="183.0" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="183.000" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">01</span></p></div></foreignObject><rect x="154.0" y="180.0" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="180.000" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Вероятность помогает ИИ работать с неопределённостью: модель сравнивает возможные классы или варианты и выбирает тот, который выглядит наиболее вероятным.</span></p></div></foreignObject><rect x="66.0" y="323.7500262467192" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="323.750" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="320.7500262467192" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="320.750" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family: Arial, sans-serif; font-size: 28.047px; font-weight: 400; font-style: normal; color: rgb(23, 44, 67);">Для корректного анализа важно различать частоту и вероятность, использовать правильное общее число наблюдений, сравнивать все вероятности в строке и связывать максимальное значение с соответствующим классом.</span></p></div></foreignObject><rect x="66.0" y="464.5000524934383" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="66.000" y="464.500" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="461.5000524934383" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="154.000" y="461.500" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Таким образом, практическая работа с вероятностями включает два связанных этапа: вычисление или чтение вероятностных оценок и проверку решений, принятых на их основе.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"></rect><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">16 / 18</span></p></div></foreignObject></svg>