<svg xmlns="http://www.w3.org/2000/svg" width="1280.0" height="720.0" viewBox="0 0 1280.0 720.0" role="img" aria-label="Слайд 11"><rect width="1280.0" height="720.0" fill="#FFFFFF"/><rect x="64.0" y="42.0" width="1150.0" height="112.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="64.000" y="42.000" width="1150.000" height="112.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:39.000px;font-weight:700;font-style:normal;color:#172C43">Итог</span></p></div></foreignObject><rect x="66.0" y="183.0" width="70.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="183.000" width="70.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">01</span></p></div></foreignObject><rect x="154.0" y="180.0" width="1050.0" height="126.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="180.000" width="1050.000" height="126.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">К концу урока обучающиеся загружают датасет, выбирают признаки, запускают KMeans, получают номера кластеров, строят карту групп и объясняют смысл найденных кластеров через признаки объектов.</span></p></div></foreignObject><rect x="66.0" y="323.7500262467192" width="70.0" height="163.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="323.750" width="70.000" height="163.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="320.7500262467192" width="1050.0" height="163.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="320.750" width="1050.000" height="163.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Полный ход работы можно представить как последовательность: выбрать числовые признаки X, задать количество кластеров, выполнить fit_predict(), добавить метки в таблицу, построить диаграмму и сравнить средние характеристики групп.</span></p></div></foreignObject><rect x="66.0" y="500.7500262467192" width="70.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="500.750" width="70.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="497.7500262467192" width="1050.0" height="90.50005249343832" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="497.750" width="1050.000" height="90.500"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:29.000px;font-weight:400;font-style:normal;color:#172C43">Ключевой вывод: алгоритм выполняет числовое разбиение объектов, но содержательная интерпретация результата остаётся задачей исследователя.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">11 / 13</span></p></div></foreignObject></svg>