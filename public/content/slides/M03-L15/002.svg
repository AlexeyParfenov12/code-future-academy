ont-family:Arial,sans-serif;font-size:33.000px;font-weight:400;font-style:normal;color:#172C43">На прошлых занятиях вы уже знакомились с отдельными элементами машинного обучения: данными, признаками, моделями и метриками.</span></p></div></foreignObject><rect x="66.0" y="338.7500262467192" width="70.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="338.750" width="70.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">02</span></p></div></foreignObject><rect x="154.0" y="335.7500262467192" width="1050.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="335.750" width="1050.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:33.000px;font-weight:400;font-style:normal;color:#172C43">Главная трудность ML-проекта обычно заключается не в одном вызове метода обучения, а в правильной организации всех этапов.</span></p></div></foreignObject><rect x="66.0" y="494.5000524934383" width="70.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="66.000" y="494.500" width="70.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:23.000px;font-weight:700;font-style:normal;color:#007D83">03</span></p></div></foreignObject><rect x="154.0" y="491.5000524934383" width="1050.0" height="141.75002624671916" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="154.000" y="491.500" width="1050.000" height="141.750"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:33.000px;font-weight:400;font-style:normal;color:#172C43">Рабочая цепочка должна быть воспроизводимой: повторный запуск ноутбука сверху вниз приводит к тому же способу подготовки данных, тому же разбиению и сопоставимым результатам.</span></p></div></foreignObject><rect x="1110.0" y="676.0" width="106.0" height="24.0" fill="none" stroke="none" stroke-width="0.0"/><foreignObject x="1110.000" y="676.000" width="106.000" height="24.000"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100%;height:100%;padding:0.00px 0.00px 0.00px 0.00px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden"><p style="margin:0.00px 0 0.00px;line-height:1.12;text-align:left;white-space:pre-wrap;overflow-wrap:break-word"><span style="font-family:Arial,sans-serif;font-size:17.000px;font-weight:400;font-style:normal;color:#556A7D">2 / 20</span></p></div></foreignObject></svg>