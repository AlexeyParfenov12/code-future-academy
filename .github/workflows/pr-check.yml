name: Verify reference-site changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check unit tests
        run: npm run test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-solutions.txt
      - name: Install content tooling
        run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-solutions.txt
      - name: Execute textbook examples
        run: python scripts/verify-knowledge.py
      - name: Check content integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify types and build
        env:
          GITHUB_PAGES_BASE: /code-future-academy/
        run: npm run build
